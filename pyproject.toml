[project]
name = "edi-festi-hack-26"
version = "0.1.0"
description = "Edinburgh festivals hackathon 2026: ticket-data processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
